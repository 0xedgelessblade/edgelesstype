name: macOS source checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm supported runner
        run: test "$(uname -m)" = arm64
      - name: Core tests (no API keys)
        run: python3 Scripts/test-core.py
      - name: Documentation references
        run: python3 Scripts/check-docs.py
      - name: Build locally signed app
        run: bash Scripts/pack-app.sh
      - name: App self-check
        run: ./edgelesstype.app/Contents/MacOS/edgelesstype self-check
      - name: Public source and app privacy checks
        run: python3 Scripts/public-check.py --app-only
