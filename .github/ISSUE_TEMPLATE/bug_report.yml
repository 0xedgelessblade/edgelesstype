name: Bug / 相容性問題
description: Report a reproducible failure without private data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        請先查看 docs/TROUBLESHOOTING.md。不要附金鑰、密文、錄音或私人聊天。
        Please use a disposable field and fixed test phrase. Never include API keys or private messages.
  - type: input
    id: environment
    attributes:
      label: macOS version and M-series chip
      placeholder: "macOS version / Apple M-series"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: App version or source revision
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target app version and input field
      description: Describe the field type. Do not share the contents of your conversation.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and fixed test text
      description: Include whether automatic paste, manual Cmd-V or Ctrl-V was used.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected vs actual result
      description: Mention missing text, duplicate text, wrong insertion position, or a preview that stays visible.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed private messages, credentials, key tables, encrypted stores and recordings.
          required: true
